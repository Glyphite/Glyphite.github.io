<head><meta charset="utf-8" />

<meta name="description" content="博客" />
<title>速览 · 晝行燈</title>
<link rel="stylesheet" href="/css/style/main.css"><link rel="stylesheet" href="/css/style/dark.css">
<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    
    <style>
      /* ── 设计令牌 ───────────────────────────── */
      @property --veil {
        syntax: "<number>";
        inherits: true;
        initial-value: 1;
      }
      @property --card-ratio {
        syntax: "<number>";
        inherits: true;
        initial-value: 1.165;
      }
      @property --detail {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }
      :root {
        --field: #10100e;
        --paper: #eee6d0;
        --accent: #c95c3f;
        --content-width: 1080px;
        --space: 2rem; /* 必须在 :root：探针挂在 body 上，写在场景里继承不到 */
        --w: min(
          26.40625vw,
          46.94444vh,
          calc(84vh * var(--card-inv-full, 0.5557))
        ); /* 第三项压住竖构图展开后的高度。乘倒数而非除比例——calc() 里除以 var() 支持不一致，整条声明会失效 */
        --tag-fs: clamp(11px, 0.78vw, 13px);
        --tag-space: clamp(58px, 5.2vh, 62px); /* 详情卡片整体下移的量，让给标签栏 */
        --tag-top: calc((var(--space) + var(--tag-space) / 2) / 2 - var(--tag-fs) * 0.725);
        --focus-img-h: 62vh;
        --expand-dur: 420ms;
        --expand-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --ink-ease: cubic-bezier(0.16, 1, 0.3, 1);
        --ink-blur: 0.32em; /* 入场：文字由虚入实、自下浮起，初始态与关键帧共用 */
        --ink-drop: 0.72em;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--field);
      }
      body {
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        isolation: isolate;
      }
      .fluid-pastels-background {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        background: var(--field);
        pointer-events: none;
        contain: strict;
      }
      .fluid-pastels-background[data-status="fallback"] {
        display: none;
      }

      /* ── 场景：收起态 / 展开态 / 详情态 ───────── */
      .stack-scene {
        --expand: 0;
        --detail: 0;
        --card-ratio: var(--card-ratio-compact, 1.165);
        position: relative;
        z-index: 2;
        width: var(--w);
        height: calc(var(--w) * var(--card-ratio));
        perspective: 900px;
        container-type: inline-size;
        isolation: isolate;
        /* --card-ratio 也进过渡：换卡时卡高跟着顶卡比例变，不加这条 height 会直接跳 */
        transition:
          width var(--expand-dur) var(--expand-ease),
          height var(--expand-dur) var(--expand-ease),
          --detail var(--expand-dur) var(--expand-ease),
          --card-ratio var(--expand-dur) var(--expand-ease);
      }
      .stack-scene[data-expand="true"] {
        --expand: 1;
        --card-ratio: var(--card-ratio-full, 1.5414);
      }
      .stack-scene.is-focus {
        --expand: 1;
        --detail: 1;
        position: fixed;
        left: 50%;
        top: 50%;
        width: min(calc(100vw - var(--space) * 2), var(--content-width));
        height: calc(100dvh - var(--space) * 2 - var(--tag-space));
        translate: -50% -50%;
        perspective: none;
        cursor: default;
      }
      .stack-scene.is-focus .orbital-field,
      .stack-scene.is-focus .interaction-hint {
        opacity: 0;
      }
      .stack-scene.is-focus .stack-shell:not(.is-active) {
        opacity: 0;
      }
      .stack-scene.is-focus .stack-shell,
      .stack-scene.is-focus .drag-plane,
      .stack-scene.is-focus .artwork {
        transform: none !important;
      }
      .stack-scene.is-focus .reveal-word,
      .stack-scene.is-focus .reveal-lockup {
        animation: none !important;
        opacity: 1 !important;
        filter: none !important;
        translate: none !important;
        scale: 1 !important;
      }
      .stack-scene.is-focus .copy-panel::before {
        animation: none !important;
        opacity: 0.045 !important;
      }
      .stack-scene.is-focus .stack-shell.is-active {
        cursor: default;
        touch-action: pan-y;
        user-select: text;
      }
      .stack-scene.is-focus .artwork {
        --edge: clamp(14px, 1.4vw, 22px);
        --img-cap: calc(var(--focus-img-h) * var(--img-w, 1) / var(--img-h, 1));
        overflow-x: clip;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .stack-scene.is-focus .artwork::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      .stack-scene.is-focus .copy-panel {
        flex: 1 0 auto;
        justify-content: flex-start;
      }
      .stack-scene.is-focus .brand-lockup {
        margin-top: auto;
      }
      /* 探针尺寸恒等于目标态：量场景会拿到过渡中间尺寸 */
      .rest-probe,
      .focus-probe {
        position: fixed;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        visibility: hidden;
        pointer-events: none;
        z-index: -1;
      }
      .rest-probe {
        width: var(--w);
        height: calc(var(--w) * var(--card-ratio-compact, 1.165));
      }
      .focus-probe {
        width: min(
          min(calc(100vw - var(--space) * 2), var(--content-width)),
          calc(var(--focus-img-h) * var(--img-w, 1) / var(--img-h, 1))
        );
        aspect-ratio: var(--img-w, 1) / var(--img-h, 1);
      }

      /* ── 背景光轨（纯装饰） ─────────────────── */
      .orbital-field {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 0;
        width: 220%;
        aspect-ratio: 1;
        pointer-events: none;
        translate: -50% -50%;
      }
      .orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--orbit-size);
        aspect-ratio: 1;
        border-radius: 50%;
        background: conic-gradient(
          from var(--orbit-angle),
          transparent 0 13%,
          rgb(238 230 208 / 0.07) 19%,
          rgb(238 230 208 / 0.26) 27%,
          rgb(201 92 63 / 0.24) 34%,
          transparent 45% 67%,
          rgb(238 230 208 / 0.17) 76%,
          transparent 88%
        );
        opacity: var(--orbit-opacity);
        translate: -50% -50%;
        rotate: 0deg;
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - var(--orbit-line)),
          #000 calc(100% - var(--orbit-line) + 0.75px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - var(--orbit-line)),
          #000 calc(100% - var(--orbit-line) + 0.75px)
        );
        animation: orbit-spin var(--orbit-speed) linear infinite;
        will-change: rotate;
      }
      .orbit-one {
        --orbit-size: 58%;
        --orbit-line: 1.5px;
        --orbit-angle: 18deg;
        --orbit-opacity: 0.9;
        --orbit-speed: 18s;
      }
      .orbit-two {
        --orbit-size: 79%;
        --orbit-line: 1px;
        --orbit-angle: 154deg;
        --orbit-opacity: 0.7;
        --orbit-speed: 27s;
        animation-direction: reverse;
      }
      .orbit-three {
        --orbit-size: 100%;
        --orbit-line: 1px;
        --orbit-angle: 252deg;
        --orbit-opacity: 0.5;
        --orbit-speed: 36s;
      }
      @keyframes orbit-spin {
        to {
          rotate: 360deg;
        }
      }

      /* ── 牌堆与 3D 位姿 ─────────────────────── */
      .stack {
        position: absolute;
        inset: 0;
        z-index: 1;
        transform-style: preserve-3d;
      }
      /* 前后关系由 --stack-z 的 3D 深度决定，不用 z-index，牌间穿插才连续 */
      .stack-shell {
        position: absolute;
        inset: 0;
        cursor: grab;
        outline: none;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        transform: translate3d(0, 0, 0);
        transform-style: preserve-3d;
        transition:
          transform 360ms var(--expand-ease),
          opacity 240ms ease;
        will-change: transform;
      }
      .stack-scene.is-arranging .stack-shell,
      .stack-scene.is-arranging .artwork {
        transition: none;
      }
      /* --veil = 收起程度：1 完全虚化，0 完全清晰 */
      .drag-plane {
        --veil: calc(1 - var(--expand, 0));
        --drag-x: 0px;
        --drag-y: 0px;
        --drag-turn: 0deg;
        --tilt-x: 0deg;
        --tilt-y: 0deg;
        position: absolute;
        inset: 0;
        transform: translate3d(var(--drag-x), var(--drag-y), 0) rotateX(var(--tilt-x))
          rotateY(var(--tilt-y)) rotateZ(var(--drag-turn));
        filter: blur(0px);
        transform-style: preserve-3d;
        transition:
          transform 300ms var(--expand-ease),
          opacity 180ms ease,
          filter 140ms ease;
        will-change: transform;
      }
      .stack-shell.is-tracking .drag-plane {
        transition-duration: 70ms;
        transition-timing-function: linear;
      }
      .stack-shell.is-dragging {
        cursor: grabbing;
      }
      .stack-shell.is-dragging .drag-plane {
        transition: none;
      }
      .stack-shell.is-dragging .artwork {
        box-shadow:
          0 4.4cqw 9.4cqw rgb(0 0 0 / 0.48),
          inset 0 0 0 1px rgb(255 255 255 / 0.15);
      }

      /* ── 卡面 ───────────────────────────────── */
      .artwork {
        /* 收起态必须是 var(--w) 不是 100cqw：收回刚开始容器还是 1080，图片会先撑大再跳回 */
        --img-cap: var(--w);
        --u: calc((var(--w) - 2px) / 100); /* 1cqw 的收起态值：详情态 cqw 会翻倍，文字一律锚这里 */
        --hanko-size: clamp(14px, calc(9.3 * var(--u)), 5rem);
        --panel: #211914;
        --ink: var(--paper);
        --accent-card: var(--accent);
        --edge: clamp(20px, 2vw, 30px);
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        container-type: inline-size;
        /* 描边画在自身 border 上：天然跟随 rotateZ/scale，也不随内容滚 */
        border: 1px solid transparent;
        background:
          linear-gradient(var(--panel), var(--panel)) padding-box,
          linear-gradient(
              145deg,
              rgb(255 255 255 / 0.22),
              rgb(238 230 208 / 0.11) 42%,
              rgb(255 255 255 / 0.035) 72%,
              rgb(201 92 63 / 0.19)
            )
            border-box;
        border-radius: var(--edge);
        box-shadow:
          0 2.6cqw 6.5cqw rgb(0 0 0 / 0.38),
          inset 0 0 0 1px rgb(255 255 255 / 0.1);
        transform: rotateZ(0deg) scale(1);
        transform-origin: 90% 90%;
        transition:
          transform var(--expand-dur) var(--expand-ease),
          box-shadow 220ms ease,
          border-radius var(--expand-dur) var(--expand-ease);
        will-change: transform;
        -webkit-user-drag: none;
      }
      .image-field {
        position: relative;
        inset: auto;
        image-rendering: pixelated; /* 默认 nearest：像素画的硬边才保得住 */
        width: min(100%, var(--img-cap, 100cqw));
        height: auto;
        aspect-ratio: var(--img-w, 1) / var(--img-h, 1);
        align-self: center;
        flex: 0 0 auto;
        display: block;
        background: var(--panel);
        pointer-events: none;
        /* 过渡写在本层：与卡片展开同时长同曲线，且不受 .drag-plane 的 70ms 覆盖 */
        transition:
          width var(--expand-dur) var(--expand-ease),
          --veil var(--expand-dur) var(--expand-ease);
        filter: blur(calc(var(--veil) * 2.6cqw))
          saturate(calc(1 - var(--veil) * 0.18)) contrast(calc(1 - var(--veil) * 0.07));
        transform: scale(calc(1 + var(--veil) * 0.085)); /* 8.5% 放大盖住模糊后的半透明边缘 */
      }
      /* 写实素材唯一的差别在缩放采样：nearest 会出锯齿与摩尔纹，交回浏览器平滑 */
      .artwork[data-smooth] .image-field {
        image-rendering: auto;
      }
      /* static 块级盒绘制顺序在定位元素之后，会被收起态放大溢出的图片盖住 */
      .copy-panel {
        --panel-pad: 1.45cqw; /* 纵向必须与落款 gap 同值，标题上下等距才成立 */
        --panel-pad-x: 3.2cqw;
        --lock-gap: 1.15cqw;
        --lock-inset: calc(var(--lock-gap) * 2.2); /* 标题左缩与印章右缩同源，左右边距才相等 */
        --panel-inner: calc(
          (var(--card-ratio-compact, 1.395) - var(--img-ratio, 1.25)) * 100cqw - var(--panel-pad) * 2
        );
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: calc(var(--expand, 0) * 1.45cqw);
        padding: var(--panel-pad) var(--panel-pad-x);
        background: var(--panel);
        color: var(--ink);
        box-shadow: inset 0 1px rgb(238 230 208 / 0.09);
        overflow: clip;
        transition: gap var(--expand-dur) var(--expand-ease);
      }
      .copy-panel::before {
        content: "";
        position: absolute;
        inset: 0 16% 5% -12%;
        background: radial-gradient(ellipse at 24% 48%, var(--accent-card), transparent 44%),
          radial-gradient(ellipse at 58% 62%, rgb(238 230 208 / 0.16), transparent 52%);
        opacity: 0;
        filter: blur(1.8cqw);
        mix-blend-mode: screen;
        pointer-events: none;
        transform-origin: 18% 52%;
      }

      /* ── 正文与链接 ─────────────────────────── */
      .detail {
        display: none;
        flex: 0 1 auto;
        min-height: 0;
        margin: 0;
        padding-inline: var(--lock-inset);
        font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun",
          Iowan Old Style, Baskerville, "Times New Roman", serif;
        font-size: clamp(0.95rem, calc(3.6 * var(--u)), 1.35rem);
        line-height: 1.85;
        letter-spacing: 0.02em;
        opacity: var(--detail, 0);
        transition: opacity 280ms ease;
        pointer-events: auto;
      }
      .stack-scene.is-focus .detail {
        display: block;
      }
      .stack-scene.is-focus .detail + .detail {
        margin-top: 0.55em;
      }
      .stack-scene.is-focus .copy,
      .stack-scene.is-focus .detail {
        flex: 0 0 auto;
      }
      .stack-scene.is-focus .copy {
        margin-block: 0;
      }
      /* 正文插图：与 .detail 同一套显隐，跟着面板宽度但封顶（位图放大到糊没意义） */
      .detail-figure {
        display: none;
        margin-block: 0.7em;
        margin-inline: 0;
        max-width: 43.75em;
      }
      .stack-scene.is-focus .detail-figure {
        display: block;
      }
      .detail-figure img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 0.35em;
        border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
      }
      .detail-figure figcaption {
        margin-top: 0.35em;
        font-size: 0.78em;
        line-height: 1.5;
        color: color-mix(in srgb, var(--ink) 62%, transparent);
      }
      .detail code {
        font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.88em;
        padding: 0.06em 0.28em;
        border-radius: 0.2em;
        background: color-mix(in srgb, var(--ink) 12%, transparent);
        letter-spacing: 0;
      }
      /* 项目链接只在详情态出现：收起态 display:none，自动退出 Tab 序列 */
      .project-links {
        display: none;
      }
      .stack-scene.is-focus .project-links {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.15em;
        flex: 0 0 auto;
        align-self: flex-start;
        max-width: calc(100% - 2 * var(--lock-inset));
        margin: calc(1.1 * var(--u)) var(--lock-inset) 0;
        padding-block: 0.15em;
        font-size: clamp(0.82rem, calc(2.9 * var(--u)), 1.1rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--ink);
        opacity: var(--detail, 0);
        transition: opacity 280ms ease;
        pointer-events: auto;
      }
      .stack-scene.is-focus .link-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        margin-block: 0;
      }
      /* 同一行相邻两项之间插竖线，行首不放 */
      .stack-scene.is-focus .link-item + .link-item::before {
        content: "丨";
        margin-inline: 0.4em;
        color: color-mix(in srgb, var(--ink) 38%, transparent);
      }
      .stack-scene.is-focus .link-anchor {
        color: var(--accent-card);
        text-decoration-line: underline;
        text-decoration-color: color-mix(in srgb, var(--accent-card) 45%, transparent);
        text-underline-offset: 0.22em;
        transition:
          color 180ms ease,
          text-decoration-color 180ms ease;
      }
      .stack-scene.is-focus .link-anchor:hover,
      .stack-scene.is-focus .link-anchor:focus-visible {
        color: var(--ink);
        text-decoration-color: currentColor;
      }

      /* ── 文案、落款与印章 ───────────────────── */
      .copy {
        flex: 0 1 auto;
        min-height: 0;
        /* 上下 auto：剩余空间平分到标题两侧，「图片→标题」与「标题→印章」相等 */
        margin: auto 0;
        padding-left: var(--lock-inset);
        overflow: clip;
        font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun",
          Iowan Old Style, Baskerville, "Times New Roman", serif;
        font-size: clamp(1.5rem, calc(9.05 * var(--u)), 3.4rem);
        line-height: 1.28;
        letter-spacing: 0.02em;
        text-wrap: balance;
        opacity: var(--expand, 0);
        translate: 0 calc((1 - var(--expand, 0)) * 0.7cqw);
        transition:
          opacity var(--expand-dur) var(--expand-ease),
          translate var(--expand-dur) var(--expand-ease);
      }
      .reveal-word {
        display: inline-block;
        padding: 0.12em 0.035em;
        margin: -0.12em -0.035em;
        vertical-align: bottom;
      }
      .brand-lockup {
        flex: 0 0 auto;
        align-self: flex-end;
        display: flex;
        align-items: center;
        gap: calc(1.45 * var(--u));
        color: var(--ink);
        margin-right: var(--lock-inset);
        margin-bottom: var(--lock-gap); /* 居中补偿要同步加下边距，否则上下间距差一个 lock-gap */
        translate: 0
          calc(
            (1 - var(--expand, 0)) * ((var(--hanko-size) - var(--panel-inner)) / 2 + var(--lock-gap))
          );
        transition: translate var(--expand-dur) var(--expand-ease);
      }
      .wordmark {
        font-size: clamp(0.62rem, calc(2.05 * var(--u)), 1.15rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .hanko {
        --hu: calc(var(--hanko-size) / 9.3);
        position: relative;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: var(--hanko-size);
        height: var(--hanko-size);
        overflow: hidden;
        color: var(--panel);
        background:
          radial-gradient(
            circle at 13% 24%,
            rgb(18 17 14 / 0.42) 0 calc(0.26 * var(--hu)),
            transparent calc(0.35 * var(--hu))
          ),
          radial-gradient(
            circle at 78% 17%,
            rgb(18 17 14 / 0.34) 0 calc(0.2 * var(--hu)),
            transparent calc(0.3 * var(--hu))
          ),
          radial-gradient(
            circle at 68% 82%,
            rgb(18 17 14 / 0.38) 0 calc(0.24 * var(--hu)),
            transparent calc(0.34 * var(--hu))
          ),
          radial-gradient(
            circle at 27% 74%,
            rgb(18 17 14 / 0.3) 0 calc(0.17 * var(--hu)),
            transparent calc(0.27 * var(--hu))
          ),
          #c64b35;
        border-radius: calc(1.05 * var(--hu)) calc(0.72 * var(--hu)) calc(1.18 * var(--hu))
          calc(0.82 * var(--hu));
        box-shadow:
          inset 0 0 0 calc(0.28 * var(--hu)) rgb(18 17 14 / 0.2),
          inset calc(0.32 * var(--hu)) calc(-0.25 * var(--hu)) calc(0.7 * var(--hu))
            rgb(18 17 14 / 0.16),
          0 calc(0.45 * var(--hu)) calc(1.25 * var(--hu)) rgb(0 0 0 / 0.16);
        transform: rotate(var(--hanko-tilt, -2.4deg));
      }
      .hanko::before {
        --ring: calc(var(--hanko-size) * 0.077);
        content: "";
        position: absolute;
        inset: var(--ring);
        border: calc(var(--hanko-size) * 0.028) solid currentColor;

            card.shell.setAttribute("aria-hidden", String(!isTop));
            card.shell.setAttribute("aria-expanded", String(isTop && focusMode));
            /* 飞行中的卡自己管位姿与标记，别在这里动 */
            if (!isTop) {
              clearDragMarks(card);
              if (!card.flying) resetTilt(card);
            }
            if (off) continue;
            const depth = N - index - 1;
            if (!card.flying) card.shell.style.zIndex = String(index + 1);
            card.shell.dataset.depth = String(depth);
            if (card.flying) continue;
            applyPose(card, depth);
          }
          status.textContent = `${top.shell.dataset.name}为当前卡片。`;
          syncCardRatio();
          markAllDirty();
          syncAnimation();
        };

        /* ── 位图与布局 ────────────────────────── */
        const applyRenderScale = () => {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          const px = Math.max(1, Math.round(rect.width * dpr));
          let changed = false;
          for (const card of cards) {
            if (!card.context) continue;
            /* 位图跟显示需求走，不被源图尺寸封顶：否则 contain 在源图分辨率下采样，实测丢 31% 像素。
               0.34 下界防大图在小屏缩过狠；照片类封顶 1 倍——放大不产生新信息，只是白占显存 */
            const wanted = Math.max(px / card.imageW, 0.34);
            /* 像素画放大取整数倍：8.75 倍会让同一格落在 8 与 9 个屏幕像素上交替，边线发虚 */
            const scale = card.smooth
              ? Math.round(Math.min(wanted, 1) * 20) / 20
              : wanted >= 1
                ? Math.round(wanted)
                : Math.round(wanted * 20) / 20;
            const w = Math.round(card.imageW * scale);
            const h = Math.round(card.imageH * scale);
            if (scale === card.scale && w === card.renderW && h === card.renderH) continue;
            card.scale = scale;
            card.renderW = w;
            card.renderH = h;
            card.canvas.width = w;
            card.canvas.height = h;
            setSmoothing(card.context, card);
            card.staticCache = null;
            card.dirty = true;
            changed = true;
          }
          return changed;
        };
        const syncCardRatio = () => {
          for (const c of cards) {
            c.artwork.style.setProperty("--img-ratio", (c.imageH / c.imageW).toFixed(4));
          }
          const tallest = Math.max(...cards.map((c) => c.imageH / c.imageW));
          /* 卡高按顶卡素材比例自适应：方形素材不再被 tallest 撑出大片空白文字区。
             宽度约束仍按 tallest（最坏情况），否则换卡时宽度会跟着跳。
             写在 :root：收起态探针挂在 body，只能继承到 :root 上的变量；宽度约束取倒数（calc 不能除 var） */
          const ratio = topCard().imageH / topCard().imageW;
          setVars(document.documentElement.style, {
            "--card-ratio-compact": (ratio + K.TEXT_COMPACT).toFixed(4),
            "--card-ratio-full": (ratio + K.TEXT_PANEL).toFixed(4),
            "--card-inv-full": (1 / (tallest + K.TEXT_PANEL)).toFixed(4),
          });
        };
        const probes = {};
        const measure = () => {
          const key = focusMode ? "focus" : "rest";
          let probe = probes[key];
          if (!probe) {
            probe = document.body.appendChild(document.createElement("div"));
            probe.className = `${key}-probe`;
            probe.setAttribute("aria-hidden", "true");
            probes[key] = probe;
          }
          const { imageW, imageH } = topCard();
          setVars(probe.style, { "--img-w": imageW, "--img-h": imageH });
          return probe.getBoundingClientRect();
        };
        const layout = () => {
          rect = measure();
          syncCardRatio();
          if (applyRenderScale()) drawAll();
        };
        /* contain 而非 cover：cover 会切掉头或脚。压矮后两侧留白由 panel 色填，透明底看不出接缝 */
        const drawSource = (g, card, source) => {
          const frames = frameCount(card);
          const fw = source.naturalWidth / frames;
          const sh = source.naturalHeight;
          const scale = Math.min(card.imageW / fw, card.imageH / sh);
          const dw = fw * scale;
          const dh = sh * scale;
          g.drawImage(
            source,
            (card.frameIndex % frames) * fw,
            0,
            fw,
            sh,
            (card.imageW - dw) / 2,
            (card.imageH - dh) / 2,
            dw,
            dh,
          );
        };

        /* ── 从图片取色 ────────────────────────── */
        const PALETTE = {
          BASE_HUE: 18,
          SAMPLE: 40,
          MIN_SAT: 0.14,
          PANEL: { s: 22, l: 12 },
          ACCENT: { s: 56, l: 52, shift: 6 },
          INK: { s: 18, l: 90, pull: 0.22 },
        };
        const rgbToHsl = (r, g, b) => {
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const l = (max + min) / 2;
          const d = max - min;
          if (!d) return { h: 0, s: 0, l };
          const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          let h;
          if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
          else if (max === g) h = (b - r) / d + 2;
          else h = (r - g) / d + 4;
          return { h: h * 60, s, l };
        };
        const hsl = (h, s, l) => `hsl(${Math.round(h)}, ${s}%, ${l}%)`;
        /* 取样缓冲复用一张：每张卡各建一张 40×40 canvas 是浪费。
           用色相直方图而非平均色（后者必然趋于灰），权重 = 饱和度 × 中心度 */
        let hueBuffer = null;
        const sampleHue = (card) => {
          const side = PALETTE.SAMPLE;
          if (!hueBuffer) {
            hueBuffer = document.createElement("canvas");
            hueBuffer.width = hueBuffer.height = side;
          }
          const g = hueBuffer.getContext("2d", { willReadFrequently: true });
          g.clearRect(0, 0, side, side);
          const fw = card.image.naturalWidth / frameCount(card);
          g.drawImage(card.image, 0, 0, fw, card.image.naturalHeight, 0, 0, side, side);
          let data;
          try {
            data = g.getImageData(0, 0, side, side).data;
          } catch {
            return null;
          }
          const bins = new Float64Array(36);
          let satSum = 0;
          let counted = 0;
          for (let i = 0; i < side * side; i++) {
            const p = i * 4;
            if (data[p + 3] < 128) continue;
            const { h, s, l } = rgbToHsl(data[p] / 255, data[p + 1] / 255, data[p + 2] / 255);
            if (l < 0.08 || l > 0.94) continue;
            satSum += s;
            counted++;
            if (s < 0.12) continue;
            const x = (i % side) / side - 0.5;
            const y = Math.floor(i / side) / side - 0.5;
            bins[Math.floor(h / 10) % 36] += s * (1 - Math.min(1, Math.hypot(x, y) * 1.6));
          }
          if (!counted || satSum / counted < PALETTE.MIN_SAT) return null;
          let best = 0;
          for (let i = 1; i < 36; i++) if (bins[i] > bins[best]) best = i;
          return bins[best] > 0 ? best * 10 + 5 : null;
        };
        const applyPalette = (card) => {
          const hue = sampleHue(card) ?? PALETTE.BASE_HUE;
          const { PANEL, ACCENT, INK } = PALETTE;
          /* 墨色向纸色拉一点，纯色相会让正文跟着素材一起偏 */
          const inkHue =
            PALETTE.BASE_HUE + (((hue - PALETTE.BASE_HUE + 540) % 360) - 180) * INK.pull;
          setVars(card.artwork.style, {
            "--panel": hsl(hue, PANEL.s, PANEL.l),
            "--accent-card": hsl(hue + ACCENT.shift, ACCENT.s, ACCENT.l),
            "--ink": hsl(inkHue, INK.s, INK.l),
          });
          card.panelColor = card.artwork.style.getPropertyValue("--panel");
          card.staticCache = null;
          card.dirty = true;
        };
        const paintPanel = (g, card) => {
          g.setTransform(card.scale, 0, 0, card.scale, 0, 0);
          g.fillStyle = card.panelColor;
          g.fillRect(0, 0, card.imageW, card.imageH);
        };
        /* 底 + 素材：静态缓存与即时绘制走同一条路径，别各画一遍 */
        const paintCard = (g, card, source) => {
          paintPanel(g, card);
          drawSource(g, card, source);
        };
        const getStaticCache = (card) => {
          if (card.staticCache) return card.staticCache;
          if (!card.imageUsable || !card.renderW) return null;
          const cache = document.createElement("canvas");
          cache.width = card.renderW;
          cache.height = card.renderH;
          const g = cache.getContext("2d", { alpha: false });
          setSmoothing(g, card);
          paintCard(g, card, card.image);
          return (card.staticCache = cache);
        };
        const drawMedia = (card) => {
          if (card.shell.hidden || !card.imageReady || !card.context) return;
          const g = card.context;
          const cache = animating(card) ? null : getStaticCache(card);
          setSmoothing(g, card);
          if (cache) {
            g.setTransform(1, 0, 0, 1, 0, 0);
            g.drawImage(cache, 0, 0);
          } else if (card.imageUsable) paintCard(g, card, card.image);
          else paintPanel(g, card);
          card.dirty = false;
        };

        /* ── 动画调度 ──────────────────────────── */
        /* 收起态不推进：虚化下看不出动画，逐帧重绘只会白烧合成 */
        const animating = (card) =>
          card.frames && !reducedMotion.matches && (expanded || focusMode);
        const needsFrames = () =>
          inView && focused && topCard().imageReady && animating(topCard());
        const render = (now) => {
          const top = topCard();
          if (now - top.frameAt >= top.frameMs) {
            top.frameIndex = (top.frameIndex + 1) % top.frames;
            top.frameAt = now;
            top.dirty = true;
          }
          for (const card of cards) if (card === top || card.dirty) drawMedia(card);
          /* frame 末尾才赋值：开头清零会多排一条清不掉的 rAF 循环 */
          frame = needsFrames() ? requestAnimationFrame(render) : 0;
        };
        const syncAnimation = () => {
          if (!needsFrames()) {
            if (frame) cancelAnimationFrame(frame);
            frame = 0;
            drawAll();
            return;
          }
          if (!frame) frame = requestAnimationFrame(render);
        };
        const settleEntryText = () => {
          clearTimeout(timers.entry);
          for (const c of cards) c.shell.classList.add("is-revealed");
        };
        const startInitialReveal = () => {
          if (revealReady || !cards.every((c) => c.imageReady)) return;
          revealReady = true;
          topCard().shell.classList.remove("is-revealed");
          debounce("entry", settleEntryText, K.ENTRY_MS);
        };

        /* ── 展开 / 收起 ───────────────────────── */
        const applyExpand = (on) => {
          expanded = on;
          scene.dataset.expand = on ? "true" : "false";
          syncAnimation();
        };
        const setExpand = (on) => {
          if (!focusMode) applyExpand(on);
        };
        const markInteracted = () => {
          scene.dataset.interacted = "true";
          settleEntryText();
        };
        /* 刻意不判 focusMode——关闭时它还是旧值 */
        const pointerOnRestCard = () => {
          if (lastPointer) {
            const b = measure();
            return (
              lastPointer.x >= b.left &&
              lastPointer.x <= b.right &&
              lastPointer.y >= b.top &&
              lastPointer.y <= b.bottom
            );
          }
          return scene.matches(":hover");
        };
        const updatePointerTilt = (event) => {
          if (!finePointer.matches || reducedMotion.matches || drag || swap || focusMode) return;
          const card = topCard();
          const x = (event.clientX - rect.left) / rect.width;
          const y = (event.clientY - rect.top) / rect.height;
          if (
            x < -K.TILT.PAD_X ||
            x > 1 + K.TILT.PAD_X ||
            y < -K.TILT.PAD_Y ||
            y > 1 + K.TILT.PAD_Y
          ) {
            resetTilt(card);
            return;
          }
          card.shell.classList.add("is-tracking");
          setTransform(
            card,
            0,
            0,
            sym((0.5 - y) * K.TILT.GAIN, K.TILT.MAX),
            sym((x - 0.5) * K.TILT.GAIN, K.TILT.MAX),
            0,
          );
        };

        /* ── 换牌动画 ──────────────────────────── */
        const startSwap = (outgoing, direction, gentle) => {
          const hadFocus =
            document.activeElement === outgoing.shell ||
            outgoing.shell.contains(document.activeElement);
          const commit = () => {
            const nk = active.indexOf(direction > 0 ? nextId(order[N - 1]) : prevId(order[N - 1]));
            order = Array.from({ length: N }, (_, k) => active[(nk - k - 1 + 2 * N) % N]);
            updateStack();
            if (hadFocus) cards[order[N - 1]].shell.focus({ preventScroll: true });
          };
          clearDragMarks(outgoing);
          if (reducedMotion.matches) {
            setTransform(outgoing);
            commit();
            return;
          }
          const { x, y, tiltX, tiltY, turn } = outgoing.drag;
          const width = Math.max(1, rect.width);
          /* 绕圈到对侧松手时（位移与锁定方向反号），飞出点不能再按绝对位移定到对侧——
             那样卡片要先横跨整屏再飞回来。改成从当前位置沿锁定方向就近推出去 */
          const overshoot = Math.max(Math.abs(x), width * K.FLING_MIN) * K.OVERSHOOT;
          const far = gentle
            ? direction * width * K.REACH
            : x + direction * (overshoot - Math.abs(x));
          const push = Math.abs(far - x);
          const back = Math.abs(far);
          const total =
            (gentle ? K.GENTLE_FLIGHT : K.FLIGHT) *
            clamp((push + back) / Math.max(1, 2 * width * K.REACH), K.MIN_SPAN, 1);
          const share = gentle ? K.RETURN_AT : push / Math.max(1, push + back);
          const p1 = clamp(Math.round(total * share), K.MIN_PHASE, Math.round(total * 0.6));
          const p2 = Math.max(K.MIN_PHASE, Math.round(total) - p1);
          const start = transformOf(x, y, tiltX, tiltY, turn);
          const away = transformOf(far, y * 0.42, tiltX * 0.35, tiltY * 0.35, turn + direction * 7);
          const home = transformOf(0, 0, 0, 0, 0);
          const blur = "blur(1.4px)";
          setTransform(outgoing);
          outgoing.flying = true;
          commit();
          /* 两段之间同步翻转层级：z-index 不能进关键帧（非合成属性，会滞后于 transform），
             所以用 finished 衔接而非定时器 */
          setSurface(outgoing, "transition", "none");
          applyPose(outgoing, 0, K.LIFT_Z);
          void outgoing.shell.offsetWidth;
          setSurface(outgoing, "transition", "");
          outgoing.shell.style.transformStyle = "flat";
          outgoing.shell.style.zIndex = String(N + 2);
          let dropped = false;
          let current = null;
          let settled = false;
          const drop = () => {
            if (dropped) return;
            dropped = true;
            /* 沉底不能瞬时：此刻卡片仍完整在画面里，瞬时写槽位就是跳变 */
            setSurface(outgoing, "transitionDuration", Math.round(p2) + "ms");
            applyPose(outgoing, N - 1);
            outgoing.shell.style.zIndex = "1";
          };
          const settle = () => {
            if (settled) return;
            settled = true;
            outgoing.flying = false;
            setExpand(pointerOnRestCard());
            drop();
            current.cancel();
            outgoing.shell.style.transformStyle = "";
            setSurface(outgoing, "transitionDuration", "");
            const at = order.indexOf(outgoing.id);
            outgoing.shell.style.zIndex = String(at + 1);
            applyPose(outgoing, N - at - 1);
            if (swap.settle === settle) swap = null;
          };
          const play = (frames, ms, easing, fill) => {
            current = outgoing.dragPlane.animate(frames, { duration: ms, easing, fill });
            return current.finished.catch(() => {});
          };
          (async () => {
            await play(
              [
                { filter: "blur(0px)", transform: start },
                { filter: blur, transform: away },
              ],
              p1,
              gentle ? K.EASE_PUSH : K.EASE_FLING,
              "forwards",
            );
            if (settled) return;
            drop();
            current.cancel();
            await play(
              [
                { filter: blur, transform: away },
                { filter: "blur(0px)", transform: home },
              ],
              p2,
              gentle ? K.EASE_RETURN : K.EASE_FLING,
            );
            settle();
          })();
          swap = {
            settle,
            unlockAt: performance.now() + (gentle ? K.GENTLE_FLIGHT : K.FLIGHT) * K.REARM,
          };
        };
        const cycleStack = (direction, gentle) => {
          /* 空标签下 active 为空，任何 nextId 都是 undefined；守住唯一入口，牌序就不会被写坏 */
          if (!active.length) return false;
          /* 单张分类没有下一张可换：nextId 会返回自己，换出去再换回来没有意义 */
          if (N < 2) {
            markInteracted();
            return false;
          }
          if (swap) {
            if (performance.now() < swap.unlockAt) return false;
            swap.settle();
          }
          const outgoing = topCard();
          markInteracted();
          arrangeForTarget(direction > 0 ? nextId(outgoing.id) : prevId(outgoing.id));
          startSwap(outgoing, direction, gentle);
          return true;
        };

        /* ── 详情态 ────────────────────────────── */
        const setFocus = (on) => {
          if (
            focusMode === on ||
            (on && drag) ||
            (on && performance.now() < topCard().suppressClickUntil)
          )
            return false;
          /* 量必须在摘类之前：此时 is-focus 还在，探针拿到的是收回后的矩形 */
          const inside = on || pointerOnRestCard();
          if (on) swap?.settle();
          focusMode = on;
          scene.classList.toggle("is-focus", on);
          applyExpand(inside);
          if (on) {
            markInteracted();
            topCard().shell.focus({ preventScroll: true });
          } else {
            topCard().suppressClickUntil = performance.now() + K.REOPEN_GUARD;
          }
          updateStack();
          /* 详情态开关是定位突变，没有过渡终点可依赖，等过渡时长过去再补一次布局：
             过渡中改位图会闪一下 */
          debounce("focus", layout, K.FOCUS_MS);
          return true;
        };

        /* ── 拖拽 ──────────────────────────────── */
        const cancelDrag = (event) => {
          if (!drag || (event?.pointerId !== undefined && event.pointerId !== drag.pointerId))
            return;
          const { card } = drag;
          drag = null;
          card.shell.classList.remove("is-dragging");
          setTransform(card);
        };
        const onDown = (card, event) => {
          if (
            card !== topCard() ||
            swap ||
            focusMode ||
            (event.button !== undefined && event.button !== 0)
          )
            return;
          drag = {
            arrangedOrder: null,
            card,
            /* dir 是第一次越过死区时定下的方向，定下后不再改；
               target 是照它排到下面的那张牌。两者都只认首次，绕圈拖才不会跳 */
            dir: 0,
            target: null,
            lastT: event.timeStamp || performance.now(),
            lastX: event.clientX,
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            velocityX: 0,
            maxDist: 0,
          };
          card.shell.classList.remove("is-tracking");
          card.shell.classList.add("is-dragging");
          card.shell.focus({ preventScroll: true });
          event.preventDefault();
        };
        const onMove = (card, event) => {
          if (event.pointerId !== drag.pointerId) return;
          const x = event.clientX - drag.startX;
          const y = event.clientY - drag.startY;
          const width = Math.max(1, rect.width);
          const now = event.timeStamp || performance.now();
          drag.velocityX =
            drag.velocityX * 0.6 +
            ((event.clientX - drag.lastX) / Math.max(1, now - drag.lastT)) * 0.4;
          drag.lastT = now;
          drag.lastX = event.clientX;
          /* 峰值而非终点位移：拖出去再拖回原位时终点是 0，只有峰值能证明这是一次拖拽 */
          drag.maxDist = Math.max(drag.maxDist, Math.abs(x), Math.abs(y));
          /* 位移落在死区（或纵向为主）时保持上一张，免得来回穿越时下面的牌反复跳 */
          const lateral = Math.abs(x) >= Math.abs(y) * K.DRAG.LATERAL;
          const dir = lateral && Math.abs(x) >= K.INTENT_SET ? Math.sign(x) : 0;
          if (dir && !drag.dir) drag.dir = dir;
          const want = drag.dir ? (drag.dir > 0 ? nextId(card.id) : prevId(card.id)) : null;
          if (want && want !== drag.target) {
            drag.target = want;
            /* 重排始终从原始快照出发。增量交换会累积——来回切几次，牌序就不是原来那副了 */
            if (!drag.arrangedOrder) drag.arrangedOrder = [...order];
            else order = [...drag.arrangedOrder];
            arrangeForTarget(want);
          }
          setTransform(
            card,
            x,
            y,
            sym((-y / width) * K.DRAG.PITCH, K.DRAG.PITCH),
            sym((x / width) * K.DRAG.YAW, K.DRAG.YAW),
            sym((x / width) * K.DRAG.ROLL, K.DRAG.ROLL_MAX),
          );
          markInteracted();
        };
        const onUp = (card, event) => {
          if (event.pointerId !== drag.pointerId) return;
          lastPointer = { x: event.clientX, y: event.clientY };
          const { arrangedOrder, dir: lockedDir, startX, startY, velocityX, maxDist } = drag;
          const x = event.clientX - startX;
          const y = event.clientY - startY;
          const threshold = clamp(rect.width * K.DRAG.RATIO, K.DRAG.MIN, K.DRAG.MAX);
          drag = null;
          const lateral = Math.abs(x) >= Math.abs(y) * K.DRAG.LATERAL;
          let direction =
            lateral &&
            (Math.abs(x) >= threshold ||
              (Math.abs(x) >= threshold * K.FLING_RATIO &&
                Math.sign(velocityX) === Math.sign(x) &&
                Math.abs(velocityX) >= K.FLING_SPEED))
              ? Math.sign(x)
              : 0;
          /* 松手也跟着锁定的方向走：否则拖到另一侧松手，换上来的会是另一张牌，最后一刻又跳一次 */
          if (direction && lockedDir) direction = lockedDir;
          card.shell.classList.remove("is-dragging");
          if (direction || maxDist >= K.INTENT_SET)
            card.suppressClickUntil = performance.now() + K.SWAP_GUARD;
          setExpand(pointerOnRestCard());
          if (direction) cycleStack(direction);
          else {
            if (arrangedOrder) {
              order = arrangedOrder;
              updateStack();
            }
            setTransform(card);
          }
        };

        /* ── 启动 ──────────────────────────────── */
        const syncVisibility = () => {
          for (const card of cards) card.shell.hidden = !active.includes(card.id);
        };
        scene.dataset.empty = String(!active.length);
        syncVisibility();
        scene.addEventListener("pointerenter", () => setExpand(true));
        scene.addEventListener("pointerleave", () => {
          if (!drag) setExpand(false);
        });
        scene.addEventListener("focusin", () => setExpand(true));
        scene.addEventListener("focusout", () => setExpand(false));
        if (isLowPower) scene.classList.add("perf-minimal");
        applyExpand(false);
        layout();

        const mediaSettled = () => {
          startInitialReveal();
          syncAnimation();
        };
        for (const card of cards) {
          once(card.image, "load", () => {
            card.imageReady = true;
            card.imageUsable = true;
            card.dirty = true;
            /* 雪碧图的 naturalWidth 是整条宽，画框要按单帧算，否则方形素材会被当成 10:1 横条 */
            const nw = card.image.naturalWidth / frameCount(card);
            const nh = card.image.naturalHeight;
            if (nw > 0 && nh > 0) {
              /* 按图片比例但封顶 IMG_BOX_MAX：竖构图不封顶会把卡片拉很长 */
              card.imageW = nw;
              card.imageH = Math.max(1, Math.round(nw * Math.min(nh / nw, K.IMG_BOX_MAX)));
              setVars(card.artwork.style, {
                "--img-w": String(card.imageW),
                "--img-h": String(card.imageH),
              });
              layout();
            }
            applyPalette(card);
            drawMedia(card);
            mediaSettled();
          });
          once(card.image, "error", () => {
            card.imageReady = true;
            if (card.context) paintPanel(card.context, card);
            mediaSettled();
          });
          card.image.src = IMAGE_DATA[card.id];

          card.shell.addEventListener("pointerdown", (event) => {
            onDown(card, event);
            if (drag) event.preventDefault();
          });
          card.shell.addEventListener("click", () => {
            if (focusMode || performance.now() < card.suppressClickUntil) return;
            if (card === topCard()) setFocus(true);
          });
          card.shell.addEventListener("keydown", (event) => {
            /* 焦点在链接上时 Enter 归链接，别被卡片的展开/收起吃掉 */
            if (event.key !== "Enter" || event.target.closest("a")) return;
            event.preventDefault();
            setFocus(focusMode ? false : card === topCard());
          });
        }

        /* ── 全局指针 / 键盘 ───────────────────── */
        let pending = null;
        let pointerFrame = 0;
        document.addEventListener(
          "pointerdown",
          (event) => {
            lastPointer = { x: event.clientX, y: event.clientY };
            pressPoint = { x: event.clientX, y: event.clientY };
          },
          true,
        );
        document.addEventListener(
          "click",
          (event) => {
            if (!focusMode) return;
            if (
              pressPoint &&
              Math.hypot(event.clientX - pressPoint.x, event.clientY - pressPoint.y) > K.CLICK_SLOP
            )
              return;
            /* 只认 X 与卡片外空白：详情态正文要能滚能选中，点卡片内不该收。
               用 closest 而非坐标——不受 rect 与视觉错位影响 */
            if (event.target.closest(".stack-scene")) return;
            setFocus(false);
            event.stopPropagation();
            event.preventDefault();
          },
          true,
        );
        addEventListener("keydown", (event) => {
          const tag = event.target.tagName;
          if (
            event.target.isContentEditable ||
            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            tag === "SELECT" ||
            event.metaKey ||
            event.ctrlKey ||
            event.altKey
          )
            return;
          if (event.key === "Escape" && focusMode) {
            event.preventDefault();
            setFocus(false);
          } else if (event.key === " ") {
            event.preventDefault();
            focusMode ? setFocus(false) : cycleStack(1, true);
          } else if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
            event.preventDefault();
            cycleStack(event.key === "ArrowRight" ? 1 : -1, true);
          }
        });
        /* pointermove 合并到一帧处理，避免 120Hz 屏上一帧跑多次逻辑 */
        addEventListener("pointermove", (event) => {
          pending = event;
          if (pointerFrame) return;
          pointerFrame = requestAnimationFrame(() => {
            pointerFrame = 0;
            if (!pending) return;
            const e = pending;
            pending = null;
            lastPointer = { x: e.clientX, y: e.clientY };
            if (drag) onMove(drag.card, e);
            updatePointerTilt(e);
          });
        });
        addEventListener("pointerup", (event) => {
          pending = null;
          if (drag) onUp(drag.card, event);
        });
        addEventListener("pointercancel", cancelDrag);
        addEventListener("mouseout", (event) => {
          if (!event.relatedTarget && !drag && !swap) resetTilt(topCard());
        });
        addEventListener("focus", () => {
          focused = true;
          syncAnimation();
        });
        addEventListener("blur", () => {
          focused = false;
          cancelDrag();
          syncAnimation();
        });
        document.addEventListener("visibilitychange", () => {
          focused = !document.hidden;
          syncAnimation();
        });
        [finePointer, reducedMotion].forEach((m) => m.addEventListener("change", syncAnimation));
        new ResizeObserver(() => debounce("resize", layout, K.RESIZE_DEBOUNCE)).observe(scene);
        new IntersectionObserver(
          (entries) => {
            inView = entries[0].isIntersecting;
            syncAnimation();
          },
          { rootMargin: "100px" },
        ).observe(scene);
        if (!finePointer.matches) {
          document.querySelector(".interaction-hint").textContent =
            "左右拖动 · 点击展开 · 点 × 或空白处收起";
        }

        /* ── 分类筛选 ──────────────────────────── */
        const tagButtons = [...document.querySelectorAll(".tag")];
        tagButtons.forEach((b) =>
          b.addEventListener("click", () => {
            const t = b.dataset.tag;
            if (t === tag) return;
            if (focusMode) setFocus(false);
            tag = t;
            active = cards.filter((c) => c.shell.dataset.tags.includes(t)).map((c) => c.id);
            scene.dataset.empty = active.length ? "false" : "true";
            tagButtons.forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.tag === t)));
            /* 空态早退：保留上次牌序与 N，避免 topCard() 取到 undefined */
            if (!active.length) return;
            N = active.length;
            syncVisibility();
            order = [...active].reverse();
            updateStack();
          }),
        );
        scene.classList.add("reveal-enabled");
        updateStack();
      })();
    </script>
  
</body>
</html>
